version: '3.8'
services:
  app:
    build: ./app
    container_name: riches-flask
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: riches-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    depends_on:
      - app
