services:
  nginx:
    image: nginx:alpine
    container_name: riches-nginx
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - AUTHOR=Riches
    volumes:
      - ./html:/usr/share/nginx/html
      - ./logs:/var/log/nginx
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
